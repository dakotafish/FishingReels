services:
  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
      - backend_venv:/app/.venv
    # The image builds its venv with `--no-dev` (no pytest). In dev we sync the
    # full set — including dev deps — into the mounted venv so `make test` works.
    command: sh -c "uv sync --frozen && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  postgres:
    ports:
      - "5432:5432"

  frontend:
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8000
      VITE_STREAMS_TARGET: http://hls:80

  # Dev HLS file server: serves the packager's recordings the same way the
  # prod edge does (same headers, same /streams/* URL contract via Vite).
  hls:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/dev-hls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/hls:/var/streams:ro
    ports:
      - "8888:80"       # direct debug access (same port MediaMTX HLS used to own)
    restart: unless-stopped

  mediamtx:
    ports:
      - "8890:8890/udp"   # SRT ingest
      - "9997:9997"       # API / stats (dev only)

volumes:
  backend_venv:
  frontend_node_modules:
