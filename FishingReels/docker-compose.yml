services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    restart: unless-stopped

  mediamtx:
    build:
      context: ./infra/mediamtx
    environment:
      # MTX_* env vars override mediamtx.yml keys. The auth callback URL is
      # injected here (with the shared secret as a query param) so the secret
      # never lands in the committed config file.
      MTX_AUTHHTTPADDRESS: http://backend:8000/api/internal/mediamtx/auth?secret=${MEDIAMTX_WEBHOOK_SECRET}
      # Used by the runOnReady/runOnNotReady hook scripts.
      BACKEND_BASE_URL: http://backend:8000
      WEBHOOK_SECRET: ${MEDIAMTX_WEBHOOK_SECRET}
    depends_on:
      - backend
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./data/hls:/recordings
    restart: unless-stopped
