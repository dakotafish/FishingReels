# Dev-only HLS file server (`hls` service in docker-compose.override.yml).
# Vite proxies /streams/*.{m3u8,m4s,mp4,ts} here with the /streams prefix
# stripped; port 8888 on the host allows direct debug access.
#
# Header policy (mirrors the prod edge in conf.d/fishingreels.conf):
#   - playlists: no-cache — an event playlist grows while the stream is live
#   - segments:  immutable — an event playlist never rewrites a segment
server {
    listen 80;
    root /var/streams;
    autoindex off;

    default_type application/octet-stream;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp4 mp4 m4s;
        video/mp2t ts;
    }

    location ~ \.m3u8$ {
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~ \.(m4s|mp4|ts)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Nothing else is served — directory listings, .sessions/, etc. all 404.
    location / {
        return 404;
    }
}
