upstream backend {
    server backend:8000;
}

server {
    listen      80;
    server_name _;

    # --- SPA static files ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API proxy → FastAPI backend ---
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- HLS served directly from disk (written by the MediaMTX packager) ---
    # Routed by file extension: only media files live under /streams/* —
    # extension-less /streams and /streams/<id> are SPA page routes and fall
    # through to `location /` -> index.html.
    #
    # Playlists are never cached (an event playlist grows while live); segments
    # are immutable (an event playlist never rewrites one).
    location ~ ^/streams/(?<hls_playlist>.+\.m3u8)$ {
        alias /var/streams/$hls_playlist;
        types { application/vnd.apple.mpegurl m3u8; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/streams/(?<hls_segment>.+\.(m4s|mp4|ts))$ {
        alias /var/streams/$hls_segment;
        types { video/mp4 mp4 m4s; video/mp2t ts; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Trailing-slash redirect helper
    location = /api  { return 301 /api/; }
}
