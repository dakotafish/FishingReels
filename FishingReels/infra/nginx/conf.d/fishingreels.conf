upstream backend {
    server backend:8000;
}

server {
    listen      80;
    server_name _;

    # --- SPA static files ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API proxy → FastAPI backend ---
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- HLS segments served directly from disk ---
    # MediaMTX writes segments here (path matches mediamtx.yml hlsDirectory).
    location /streams/ {
        alias /var/streams/;

        # CORS for HLS players that may be hosted elsewhere (none right now).
        add_header Access-Control-Allow-Origin  "*"  always;
        add_header Cache-Control                "no-cache" always;

        # Allow .m3u8 / .ts / .m4s extensions only
        location ~ \.(m3u8|ts|m4s|mp4)$ {
            try_files $uri =404;
        }

        # Deny directory listing
        autoindex off;
    }

    # Trailing-slash redirect helpers
    location = /api  { return 301 /api/; }
    location = /streams { return 301 /streams/; }
}
