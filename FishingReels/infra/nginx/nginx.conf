user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;

    # Reasonable defaults for the 125-stream design point
    keepalive_timeout    65;
    client_max_body_size 16M;

    # Logging — stdout/stderr so Docker captures it
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # gzip for the SPA and JSON; HLS segments are already compressed
    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
