<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px 32px; background: var(--ink); display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .chip { font-family: var(--font-label); font-weight: 800; font-size: 13px; letter-spacing: .1em;
    text-transform: uppercase; padding: 9px 16px; border-radius: 999px; }
  .chip--sky { background: var(--sky); color: var(--ink); }
  .chip--outline { border: 2px solid var(--seafoam); color: var(--seafoam); }
  .stat { font-family: var(--font-display); font-weight: 800; font-size: 30px; color: var(--sky); letter-spacing: .01em; }
  .stat small { display:block; font-family: var(--font-label); font-size: 11px; letter-spacing: .12em; color: var(--seafoam); font-weight:800; }
</style>
</head>
<body>
  <span class="cl-badge-live">LIVE · DAY 2</span>
  <span class="chip chip--sky">62 BOATS</span>
  <span class="chip chip--outline">JERKBAIT</span>
  <div class="stat">52.10<small>LB · SEASON</small></div>
</body>
</html>
