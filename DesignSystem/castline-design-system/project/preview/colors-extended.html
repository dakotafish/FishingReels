<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); padding: 24px; font-family: var(--font-label); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .sw { border-radius: 10px; border: 2px solid var(--ink); overflow: hidden; }
  .chip { height: 58px; }
  .meta { padding: 7px 9px; background: var(--paper); }
  .name { font-weight: 800; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); }
  .hex { font-family: var(--font-body); font-size: 10.5px; color: var(--deep-blue); }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#EBE1CE"></div><div class="meta"><div class="name">Sand</div><div class="hex">#EBE1CE</div></div></div>
    <div class="sw"><div class="chip" style="background:#143B45"></div><div class="meta"><div class="name">Shadow</div><div class="hex">#143B45</div></div></div>
    <div class="sw"><div class="chip" style="background:#296E97"></div><div class="meta"><div class="name">Deep Blue</div><div class="hex">#296E97</div></div></div>
    <div class="sw"><div class="chip" style="background:#AFE0BA"></div><div class="meta"><div class="name">Mint</div><div class="hex">#AFE0BA</div></div></div>
    <div class="sw"><div class="chip" style="background:#2B272A"></div><div class="meta"><div class="name">Near-Black</div><div class="hex">#2B272A</div></div></div>
  </div>
</body>
</html>
