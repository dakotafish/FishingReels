<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 26px 30px; background: var(--paper); font-family: var(--font-label); }
  .row { display: flex; align-items: flex-end; gap: 22px; }
  .item { text-align: center; }
  .box { background: var(--sky); border: 2px solid var(--ink); }
  .name { font-weight: 800; font-size: 11px; letter-spacing: .05em; color: var(--ink); margin-top: 10px; }
  .val { font-family: var(--font-body); font-size: 10px; color: var(--deep-blue); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="width:46px;height:46px;border-radius:6px;background:var(--sand)"></div><div class="name">SM</div><div class="val">6px</div></div>
    <div class="item"><div class="box" style="width:58px;height:58px;border-radius:10px;background:var(--seafoam)"></div><div class="name">MD</div><div class="val">10px</div></div>
    <div class="item"><div class="box" style="width:74px;height:74px;border-radius:16px"></div><div class="name">LG</div><div class="val">16px</div></div>
    <div class="item"><div class="box" style="width:90px;height:90px;border-radius:28px;background:var(--moss)"></div><div class="name">XL</div><div class="val">28px</div></div>
    <div class="item"><div class="box" style="width:74px;height:74px;border-radius:999px;background:var(--flame)"></div><div class="name">PILL</div><div class="val">999px</div></div>
  </div>
</body>
</html>
