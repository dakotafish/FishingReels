<!-- @dsCard group="Spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 26px 30px; background: var(--paper); font-family: var(--font-label); }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { text-align: center; }
  .bar { background: var(--flame); border-radius: 3px; width: 26px; }
  .name { font-weight: 800; font-size: 10px; letter-spacing: .04em; color: var(--ink); margin-top: 8px; }
  .val { font-family: var(--font-body); font-size: 10px; color: var(--deep-blue); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><div class="name">1</div><div class="val">4</div></div>
    <div class="item"><div class="bar" style="height:8px"></div><div class="name">2</div><div class="val">8</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="name">3</div><div class="val">12</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="name">4</div><div class="val">16</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="name">5</div><div class="val">24</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="name">6</div><div class="val">32</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="name">7</div><div class="val">48</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="name">8</div><div class="val">64</div></div>
    <div class="item"><div class="bar" style="height:96px"></div><div class="name">9</div><div class="val">96</div></div>
  </div>
</body>
</html>
