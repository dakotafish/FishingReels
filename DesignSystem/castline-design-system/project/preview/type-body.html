<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); padding: 26px 32px; }
  .lbl { font-family: var(--font-label); font-weight:800; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--deep-blue); margin-bottom: 6px; }
  .block { margin-bottom: 18px; }
  .body { font-family: var(--font-body); font-weight:400; font-size: 15px; line-height: 1.6; max-width: 600px; }
  .accent { font-family: var(--font-accent); font-style: normal; font-size: 26px; color: var(--moss); }
</style>
</head>
<body>
  <div class="block">
    <div class="lbl">Body · Epilogue Regular</div>
    <p class="body" style="margin:0">Castline connects viewers to every angler, every moment, and every story unfolding on the water in real time.</p>
  </div>
  <div class="block">
    <div class="lbl">Accent · BBH Hegarty</div>
    <div class="accent">Jerkbait &amp; Flippin</div>
  </div>
</body>
</html>
