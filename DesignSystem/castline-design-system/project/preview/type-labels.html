<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--ink); color: var(--paper);
    font-family: var(--font-label); padding: 28px 32px; }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .lbl { font-family: var(--font-label); font-weight:800; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--seafoam); margin-bottom: 8px; }
  .eyebrow { font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; }
  .nav { display:flex; gap: 28px; }
</style>
</head>
<body>
  <div class="stack">
    <div>
      <div class="lbl">Eyebrow / metadata · Epilogue ExtraBold · +0.13em</div>
      <div class="eyebrow" style="font-size:18px; color:var(--sky)">LIVE · DAY 2 &nbsp;·&nbsp; 62 BOATS &nbsp;·&nbsp; 52.10 LB</div>
    </div>
    <div>
      <div class="lbl">Navigation</div>
      <div class="nav eyebrow" style="font-size:16px">
        <span>TOURNAMENTS</span><span>ANGLERS</span><span>EXPOS</span><span>ABOUT</span>
      </div>
    </div>
  </div>
</body>
</html>
