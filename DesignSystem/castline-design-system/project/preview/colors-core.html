<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); padding: 24px; font-family: var(--font-label); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { border-radius: 10px; border: 2px solid var(--ink); overflow: hidden; }
  .chip { height: 64px; }
  .meta { padding: 7px 9px; background: var(--paper); }
  .name { font-weight: 800; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
  .hex { font-family: var(--font-body); font-size: 11px; color: var(--deep-blue); letter-spacing: .03em; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#83BAD4"></div><div class="meta"><div class="name">Sky</div><div class="hex">#83BAD4</div></div></div>
    <div class="sw"><div class="chip" style="background:#213845"></div><div class="meta"><div class="name">Ink</div><div class="hex">#213845</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFF9EF"></div><div class="meta"><div class="name">Paper</div><div class="hex">#FFF9EF</div></div></div>
    <div class="sw"><div class="chip" style="background:#E46B3B"></div><div class="meta"><div class="name">Flame</div><div class="hex">#E46B3B</div></div></div>
    <div class="sw"><div class="chip" style="background:#577147"></div><div class="meta"><div class="name">Moss</div><div class="hex">#577147</div></div></div>
    <div class="sw"><div class="chip" style="background:#B9D6CD"></div><div class="meta"><div class="name">Seafoam</div><div class="hex">#B9D6CD</div></div></div>
    <div class="sw"><div class="chip" style="background:#EDC73B"></div><div class="meta"><div class="name">Gold</div><div class="hex">#EDC73B</div></div></div>
    <div class="sw"><div class="chip" style="background:#1C1A17"></div><div class="meta"><div class="name">Carbon</div><div class="hex">#1C1A17</div></div></div>
  </div>
</body>
</html>
